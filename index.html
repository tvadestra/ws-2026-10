<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MWB Reflection Poll</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --ink:#1c2230; --muted:#5d6475; --title:#34446b; --band:#dfe1ea; --card:#f2f2f2;
  --line:#cfd1d6; --bg:#ffffff; --accent:#2b3a67; --accent-ink:#ffffff; --ok:#2e7d4f; --warn:#a15c00; --err:#b3261e;
  --s1:#e3e6ee; --s2:#b9c0d4; --s3:#8a95b6; --s4:#5a6994; --s5:#2b3a67;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
h1{font-weight:500;color:var(--title);font-size:24px;margin:0}
h2{font-size:16px;margin:0}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:20px;letter-spacing:.2px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.band{background:var(--band);border-radius:6px;padding:12px 16px;margin:14px 0;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:8px 0 16px}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;font-size:14px}
.tab.on{color:var(--ink);border-color:var(--accent)}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle}
.dot.open{background:var(--ok)} .dot.closed{background:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=password],input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
textarea{resize:vertical;min-height:40px}
input:disabled,textarea:disabled{background:#f7f7f7;color:var(--muted)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn.sec{background:#fff;color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn.danger{background:#fff;color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#e6e6e6;color:var(--muted)}
.pill.open{background:#dcefe3;color:var(--ok)} .pill.closed{background:#e9e3d6;color:var(--warn)}
.ctl{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.small{font-size:12px;color:var(--muted)}
.cap{font-size:11px;font-weight:700;color:var(--muted);text-transform:none;margin-bottom:2px}
.linkbox{display:flex;gap:8px;align-items:center;margin-top:8px}
.linkbox input{font-size:12px}
.res{margin-top:16px}
.q{margin-bottom:18px}
.qt{font-weight:600;margin-bottom:6px}
.stack{display:flex;height:28px;border-radius:6px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.stack div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;min-width:0;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.big{font-size:28px;font-weight:700;color:var(--title)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted)}
.bar{height:10px;background:var(--s5);border-radius:5px}
.barbg{background:#fff;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.listed{opacity:.45}
.li{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.li .n{width:22px;text-align:right;font-weight:700;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:90vw}
.toast.err{background:var(--err)}
.overlay{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center}
.overlay .qrbig{background:#fff;padding:16px}
.foot{border-top:1px solid var(--line);margin-top:24px;padding-top:10px;display:flex;justify-content:center}
body.exporting .no-print{display:none!important}
.warnbox{border:1px solid #e7c98f;background:#fff7e6;border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0}
.testlog{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--ink);color:#fff;border-radius:8px;padding:10px 12px;white-space:pre-wrap;margin:10px 0 0}
/* participant */
.pv{max-width:560px;margin:0 auto;padding:18px 16px 60px}
.pv .card{padding:16px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.scale button{height:52px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700;cursor:pointer}
.scale button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.anchors{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.slot{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.slot .n{width:22px;padding-top:9px;font-weight:700;color:var(--muted);text-align:right;flex:none}
.pick{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;font-size:15px}
.pick .rk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700}
.pick.on{border-color:var(--accent)} .pick.on .rk{background:var(--accent);border-color:var(--accent);color:#fff}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,#fff 30%);padding-top:18px}
.full{width:100%;padding:14px;font-size:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================================
   MWB reflection poll — single-file facilitator canvas + participant view.
   Facilitator view: plain URL.  Participant view: URL + #poll=<binId>|<participantKey>
   Vote store: jsonbin.io (private bins, participant access key). See Setup tab.
   ========================================================================= */
const API = 'https://api.jsonbin.io/v3';
const LS_STATE = 'mwb-poll-v4', LS_MASTER = 'mwb-jsonbin-master', LS_VOTER = 'mwb-voter-id';
const SYNC_MS = 10000;

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const fmt = (x,d=1) => (x==null || isNaN(x)) ? '–' : Number(x).toFixed(d);

function toast(msg, isErr){
  const t = document.createElement('div'); t.className = 'toast' + (isErr ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), isErr ? 6000 : 2500);
}

/* ---------------- jsonbin API layer ---------------- */
async function api(method, path, { auth, body, headers = {} } = {}){
  const h = { ...headers };
  if (auth && auth.master) h['X-Master-Key'] = auth.master;
  if (auth && auth.access) h['X-Access-Key'] = auth.access;
  if (body !== undefined) h['Content-Type'] = 'application/json';
  const res = await fetch(API + path, { method, headers: h, body: body !== undefined ? JSON.stringify(body) : undefined, cache: 'no-store' });
  let j = null; try { j = await res.json(); } catch(e){}
  if (!res.ok) throw new Error((j && j.message) ? j.message : ('HTTP ' + res.status));
  return j;
}
const unwrap = j => (j && j.record && j.metadata) ? j.record : j;
async function createBin(record, name, master){
  const j = await api('POST', '/b', { auth:{master}, body: record, headers: { 'X-Bin-Private':'true', 'X-Bin-Name': name.slice(0,128) } });
  const id = j && j.metadata && j.metadata.id;
  if (!id) throw new Error('jsonbin did not return a bin id');
  return id;
}
async function readBin(id, auth){ return unwrap(await api('GET', '/b/' + id + '/latest', { auth, headers:{ 'X-Bin-Meta':'false' } })); }
async function writeBin(id, record, auth){ return api('PUT', '/b/' + id, { auth, body: record }); }
async function deleteBin(id, master){ return api('DELETE', '/b/' + id, { auth:{master} }); }
async function createAccessKey(master){
  const name = ('mwb-poll-' + new Date().toISOString().slice(0,10)).slice(0,32);
  // Endpoint is /v3/a on the API root — never fall back to the Master Key if this fails.
  const j = await api('POST', '/a', { auth:{master}, headers:{ 'X-Key-Name': name },
    body: { bins: { read:true, update:true, create:false, delete:false } } });
  const key = j && j.accessKey;
  if (typeof key !== 'string' || key.length < 10) throw new Error('jsonbin did not return an access key — poll links not created');
  if (key === master) throw new Error('Returned key equals the Master Key — aborted');
  return { key, name };
}

/* =========================================================================
   PARTICIPANT VIEW
   ========================================================================= */
function parseHash(){
  const h = location.hash || '';
  if (!h.startsWith('#poll=')) return null;
  const raw = h.slice(6), i = raw.indexOf('|');
  if (i < 1) return null;
  return { binId: raw.slice(0,i), key: decodeURIComponent(raw.slice(i+1)) };
}
function voterId(){
  if (window.__vid) return window.__vid;
  let v = store.get(LS_VOTER);
  if (!v){ v = uid(); store.set(LS_VOTER, v); }
  window.__vid = v; // stable for this page even if storage is blocked
  return v;
}

const P = { rec:null, status:'loading', draft:null, msg:'', had:false };

async function pLoad(){
  const { binId, key } = parseHash();
  P.status = 'loading'; pRender();
  try {
    const rec = await readBin(binId, { access:key });
    P.rec = rec;
    if (!rec || !rec.pollType) throw new Error('Poll not found');
    const mine = rec.votes && rec.votes[voterId()];
    P.had = !!mine;
    P.draft = pDraftFrom(rec, mine);
    P.status = rec.open ? 'form' : 'closed';
  } catch(e){ P.status = 'error'; P.msg = e.message; }
  pRender();
}
function pDraftFrom(rec, mine){
  if (rec.pollType === 'scale') return { answers: mine ? { ...mine.answers } : {} };
  if (rec.pollType === 'text'){
    const a = Array.from({ length: rec.slots }, (_,i) => ({ text: (mine && mine.answers[i] && mine.answers[i].text) || '', rank: (mine && mine.answers[i] && mine.answers[i].rank) || null }));
    return { answers: a };
  }
  if (rec.pollType === 'rank') return { order: mine ? [...mine.order] : [] };
  return {};
}
function pValid(){
  const r = P.rec, d = P.draft;
  if (r.pollType === 'scale') return r.questions.every(q => d.answers[q.id] >= 1);
  if (r.pollType === 'text'){
    const filled = d.answers.filter(a => a.text.trim());
    if (filled.length < Math.max(1, r.minAnswers)) return false;
    if (!r.selfRank) return true;
    const need = Math.min(r.rankN, filled.length);
    return filled.filter(a => a.rank).length === need;
  }
  if (r.pollType === 'rank') return d.order.length === Math.min(r.rankN, r.items.length);
  return false;
}
function pRender(){
  const app = document.getElementById('app');
  const r = P.rec;
  let h = '<div class="pv"><div class="top"><span class="brand">Vadestra</span><span class="small">Live poll</span></div>';
  if (P.status === 'loading'){ h += '<p>Loading poll…</p></div>'; app.innerHTML = h; return; }
  if (P.status === 'error'){ h += `<div class="card"><h2>Could not load the poll</h2><p class="small">${esc(P.msg)}</p><button class="btn" data-pact="reload">Try again</button></div></div>`; app.innerHTML = h; return; }
  h += `<h1 style="font-size:20px;margin:14px 0 4px">${esc(r.title)}</h1>`;
  if (P.status === 'closed'){ h += `<div class="card"><h2>This poll is closed</h2><p class="small">Wait for the facilitator to open the next question, then scan the new QR code.</p><button class="btn sec" data-pact="reload">Check again</button></div></div>`; app.innerHTML = h; return; }
  if (P.status === 'done'){ h += `<div class="card"><h2>Thank you — your answer is saved.</h2><p class="small">You can change it while the poll is open. Submitting again replaces your earlier answer.</p><button class="btn sec" data-pact="edit">Change my answer</button></div></div>`; app.innerHTML = h; return; }
  if (P.had) h += '<div class="warnbox">You have already answered. Submitting again replaces your earlier answer.</div>';
  const d = P.draft;
  if (r.pollType === 'scale'){
    r.questions.forEach(q => {
      h += `<div class="card"><div class="qt">${esc(q.text)}</div><div class="scale">`;
      for (let v=1; v<=5; v++) h += `<button class="${d.answers[q.id]===v?'on':''}" data-pact="scale" data-q="${esc(q.id)}" data-v="${v}" aria-label="${v}">${v}</button>`;
      h += `</div><div class="anchors"><span>1 = ${esc(r.low)}</span><span>5 = ${esc(r.high)}</span></div></div>`;
    });
  }
  if (r.pollType === 'text'){
    h += `<div class="card"><div class="qt">${esc(r.prompt)}</div><p class="small">Write up to ${r.slots} reasons, one per line${r.minAnswers>1?` (at least ${r.minAnswers})`:''}.</p>`;
    d.answers.forEach((a,i) => { h += `<div class="slot"><span class="n">${i+1}</span><textarea rows="1" maxlength="200" data-pin="${i}" placeholder="Reason ${i+1}">${esc(a.text)}</textarea></div>`; });
    h += '</div>';
    if (r.selfRank) h += `<div class="card" id="rankzone">${pRankZone()}</div>`;
  }
  if (r.pollType === 'rank'){
    const need = Math.min(r.rankN, r.items.length);
    h += `<div class="card"><div class="qt">${esc(r.prompt)}</div><p class="small">Tap your top ${need} in order: first tap = most likely. Tap again to remove. <b>${d.order.length} of ${need}</b> selected.</p>`;
    r.items.forEach(it => {
      const k = d.order.indexOf(it.id);
      h += `<button class="pick ${k>=0?'on':''}" data-pact="rank" data-id="${esc(it.id)}"><span class="rk">${k>=0?k+1:''}</span><span>${esc(it.text)}</span></button>`;
    });
    h += '</div>';
  }
  h += `<div class="sticky"><button class="btn full" data-pact="submit" ${pValid()?'':'disabled'} id="psubmit">${P.status==='sending'?'Saving…':'Submit'}</button>${P.msg?`<p class="small" style="color:var(--err)">${esc(P.msg)}</p>`:''}</div></div>`;
  app.innerHTML = h;
}
function pRankZone(){
  const r = P.rec, d = P.draft;
  const filled = d.answers.map((a,i) => ({...a, i})).filter(a => a.text.trim());
  const need = Math.min(r.rankN, filled.length);
  if (!filled.length) return `<div class="qt">Then rank your top ${r.rankN}</div><p class="small">Your reasons will appear here once you write them.</p>`;
  let h = `<div class="qt">Now rank your top ${need}</div><p class="small">Tap in order: first tap = most likely. Tap again to remove. <b>${filled.filter(a=>a.rank).length} of ${need}</b> ranked.</p>`;
  filled.forEach(a => { h += `<button class="pick ${a.rank?'on':''}" data-pact="selfrank" data-i="${a.i}"><span class="rk">${a.rank||''}</span><span>${esc(a.text)}</span></button>`; });
  return h;
}
function pRefreshRank(){
  const z = document.getElementById('rankzone'); if (z) z.innerHTML = pRankZone();
  const b = document.getElementById('psubmit'); if (b) b.disabled = !pValid();
}
function compactRanks(answers){
  const ranked = answers.filter(a => a.rank && a.text.trim()).sort((a,b) => a.rank - b.rank);
  answers.forEach(a => { if (!a.text.trim()) a.rank = null; });
  ranked.forEach((a,k) => a.rank = k+1);
}
async function pSubmit(){
  if (!pValid() || P.status === 'sending') return;
  const { binId, key } = parseHash(), auth = { access:key }, vid = voterId(), nonce = uid();
  const r = P.rec, d = P.draft;
  let vote;
  if (r.pollType === 'scale') vote = { answers: { ...d.answers } };
  if (r.pollType === 'text') vote = { answers: d.answers.filter(a => a.text.trim()).map(a => ({ text:a.text.trim().slice(0,200), rank: r.selfRank ? (a.rank||null) : null })) };
  if (r.pollType === 'rank') vote = { order: [...d.order] };
  vote.nonce = nonce; vote.at = new Date().toISOString();
  P.status = 'sending'; P.msg = ''; pRender();
  for (let attempt = 1; attempt <= 3; attempt++){
    try {
      const rec = await readBin(binId, auth);
      if (!rec.open){ P.status = 'closed'; pRender(); return; }
      rec.votes = rec.votes || {}; rec.votes[vid] = vote;
      await writeBin(binId, rec, auth);
      const chk = await readBin(binId, auth);           // verify the vote actually landed
      if (chk.votes && chk.votes[vid] && chk.votes[vid].nonce === nonce){ P.status = 'done'; P.had = true; pRender(); pGuard(vote); return; }
    } catch(e){ P.msg = e.message; }
    await sleep(500 + Math.random()*1500);              // random back-off, then retry
  }
  P.status = 'form'; P.msg = 'Your answer could not be saved. Please tap Submit again.'; pRender();
}
/* A participant who read the record just before us can still write it back
   without our vote after we verified. Re-check a few times and re-write if lost. */
let guardRun = 0;
async function pGuard(vote){
  const run = ++guardRun, { binId, key } = parseHash(), auth = { access:key }, vid = voterId();
  for (const wait of [2500, 5000, 8000, 15000]){
    await sleep(wait + Math.random()*1000);
    if (run !== guardRun) return;                      // a newer submission took over
    try {
      const rec = await readBin(binId, auth);
      if (!rec.open) return;
      if (!(rec.votes && rec.votes[vid] && rec.votes[vid].nonce === vote.nonce)){
        rec.votes = rec.votes || {}; rec.votes[vid] = vote;
        await writeBin(binId, rec, auth);
      }
    } catch(e){}
  }
}
function pBind(){
  const app = document.getElementById('app');
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-pact]'); if (!b) return;
    const a = b.dataset.pact, d = P.draft;
    if (a === 'reload') pLoad();
    if (a === 'edit'){ P.status = 'form'; pRender(); }
    if (a === 'submit') pSubmit();
    if (a === 'scale'){ d.answers[b.dataset.q] = +b.dataset.v; pRender(); }
    if (a === 'rank'){
      const id = b.dataset.id, k = d.order.indexOf(id), need = Math.min(P.rec.rankN, P.rec.items.length);
      if (k >= 0) d.order.splice(k,1); else if (d.order.length < need) d.order.push(id);
      pRender();
    }
    if (a === 'selfrank'){
      const ans = d.answers[+b.dataset.i], filled = d.answers.filter(x => x.text.trim());
      const need = Math.min(P.rec.rankN, filled.length), used = filled.filter(x => x.rank).length;
      if (ans.rank){ ans.rank = null; compactRanks(d.answers); }
      else if (used < need) ans.rank = used + 1;
      pRefreshRank();
    }
  });
  app.addEventListener('input', e => {
    const t = e.target; if (t.dataset.pin === undefined) return;
    P.draft.answers[+t.dataset.pin].text = t.value;
    compactRanks(P.draft.answers);
    pRefreshRank();
  });
}

/* =========================================================================
   FACILITATOR VIEW
   ========================================================================= */
const basePoll = () => ({ binId:null, status:'idle', votes:{}, frozen:null, lastSync:null });
function DEFAULT(){
  return {
    v:4,
    title:'Reflection on the Must-Win Battles',
    purpose:'Check that everyone is clear on their role and why we have these Must-Win Battles, and gauge how realistic the planned timeline feels.',
    tab:'p1', pkey:null, pkeyName:null, bins:[],
    pre: Array.from({length:8}, () => ({ id:uid(), text:'' })),   // 8 pre-decided reasons
    live: [],                                                     // up to 5 added live in the room
    polls:{
      p1:{ ...basePoll(), type:'scale', num:'1', title:'Clarity and expectations',
           questions:[ {id:'q1', text:'Is it clear why we have these Must-Win Battles and activities?'},
                       {id:'q2', text:'Is it clear to me what is expected of me in this programme?'} ],
           low:'Not clear', high:'Fully clear' },
      p2:{ ...basePoll(), type:'scale', num:'2a', title:'Realism of the 2028 timeline',
           questions:[ {id:'q1', text:'Is it realistic to complete the activities by 2028?'} ],
           low:'Not realistic', high:'Fully realistic' },
      p4:{ ...basePoll(), type:'rank', num:'2b', title:'Most likely reasons for not completing by 2028',
           prompt:'If we do not complete the activities by 2028, what are the most likely reasons? Rank your top 5.',

const votesOf = p => (p.status === 'closed' && p.frozen) ? p.frozen : (p.votes || {});

const linkFor = p => location.href.split('#')[0] + '#poll=' + p.binId + '|' + encodeURIComponent(S.pkey || '');

/* ---------- aggregation ---------- */
function aggScale(p){
  const V = Object.values(votesOf(p));
  return p.questions.map(q => {
    const c = [0,0,0,0,0,0]; let sum = 0, n = 0;
    V.forEach(v => { const x = v.answers && v.answers[q.id]; if (x>=1 && x<=5){ c[x]++; sum += x; n++; } });
    return { q, c, n, mean: n ? sum/n : null };
  });
}
function voterOrder(p){
  return Object.entries(votesOf(p)).sort((a,b) => String(a[1].at).localeCompare(String(b[1].at))).map(([id,v],i) => ({ id, v, idx:i+1 }));
}
function aggText(p){
  const rows = [];
  voterOrder(p).forEach(({v, idx}) => (v.answers||[]).forEach(a => { if (a.text && a.text.trim()) rows.push({ text:a.text.trim(), rank:a.rank||null, voter:idx, pts: a.rank ? (p.rankN + 1 - a.rank) : 0 }); }));
  rows.sort((a,b) => b.pts - a.pts || a.voter - b.voter);
  return rows;
}
function aggRank(p){
  const V = Object.values(votesOf(p)), N = p.rankN;
  const m = {}; p.items.forEach(it => m[it.id] = { it, pts:0, top:0, first:0 });
  V.forEach(v => (v.order||[]).forEach((id,k) => { if (m[id]){ m[id].pts += N - k; m[id].top++; if (k===0) m[id].first++; } }));
  return Object.values(m).sort((a,b) => b.pts - a.pts || b.first - a.first);
}

function scaleResults(p){

}

/* ---------- poll actions ---------- */
function recordFor(pid){
  const p = S.polls[pid];
  const r = { pollType:p.type, open:true, title:p.title, votes:{} };
  if (p.type === 'scale') Object.assign(r, { questions: clone(p.questions), low:p.low, high:p.high });
  if (p.type === 'text') Object.assign(r, { prompt:p.prompt, slots:Math.max(1,Math.min(10,p.slots|0)), minAnswers:Math.max(1,p.minAnswers|0), selfRank:!!p.selfRank, rankN:p.rankN });
  if (p.type === 'rank') Object.assign(r, { prompt:p.prompt, rankN:p.rankN, items: clone(p.items) });
  return r;
}
async function withBusy(fn){
  if (busy) return; busy = true; render();
  try { await fn(); } catch(e){ toast(e.message, true); }
  busy = false; save(); render();
}
const mAuth = () => ({ master });
// Keep every vote the facilitator has ever seen (per voter, newest wins), so a vote
// overwritten later by a racing participant write is not lost from the results.
function mergeVotes(a, b){
  const out = { ...(a||{}) };
  Object.entries(b||{}).forEach(([k,v]) => { if (!out[k] || String(v.at) >= String(out[k].at)) out[k] = v; });
  return out;
}
function startPoll(pid){
  const p = S.polls[pid];
  if (!master){ toast('Add the jsonbin Master Key in Setup first.', true); S.tab = 'setup'; render(); return; }
  if (!S.pkey){ toast('Create the participant key in Setup first.', true); S.tab = 'setup'; render(); return; }
  if (p.type === 'rank'){
    const items = listItems();
    if (items.length < p.rankN){ toast(`Fill in at least ${p.rankN} reasons first.`, true); return; }
    p.items = items;
  }
  if (p.type === 'text' && p.minAnswers > p.slots) p.minAnswers = p.slots;
  withBusy(async () => {
    const id = await createBin(recordFor(pid), 'mwb-' + pid + '-' + new Date().toISOString().slice(0,16), master);
    Object.assign(p, { binId:id, status:'open', votes:{}, frozen:null, lastSync:Date.now() });
    S.bins.push({ id, pid, at:new Date().toISOString() });
  });
}
function closePoll(pid){
  const p = S.polls[pid];
  withBusy(async () => {
    const rec = await readBin(p.binId, mAuth());
    rec.open = false; rec.votes = mergeVotes(p.votes, rec.votes); await writeBin(p.binId, rec, mAuth());
    Object.assign(p, { status:'closed', votes: rec.votes, frozen: clone(rec.votes), lastSync:Date.now() });
    // guard: a participant write that started before closing could re-open the record
    await sleep(2500);
    const chk = await readBin(p.binId, mAuth());
    if (chk.open){ chk.open = false; chk.votes = p.frozen; await writeBin(p.binId, chk, mAuth()); }
  });
}
function reopenPoll(pid){
  const p = S.polls[pid];
  withBusy(async () => {
    const rec = await readBin(p.binId, mAuth());
    rec.open = true; rec.votes = mergeVotes(p.votes, rec.votes); await writeBin(p.binId, rec, mAuth());
    Object.assign(p, { status:'open', votes: rec.votes, frozen:null, lastSync:Date.now() });
  });
}
function resetPoll(pid){
  if (!confirmInline('Clear results for this poll and start a new round? (The old record stays in jsonbin until you delete poll data in Setup.)')) return;
  Object.assign(S.polls[pid], basePoll()); save(); render();

// Log lives outside S so it is never saved or exported; it survives re-renders.
let testLog = '';
function tlog(m){
  testLog += (testLog ? '\n' : '') + m;
  const el = document.getElementById('testlog'); if (el){ el.hidden = false; el.textContent = testLog; }
}
async function runConnectionTest(){
  testLog = '';
  await withBusy(async () => {
    tlog('Connection test · ' + new Date().toLocaleString());
    if (location.protocol !== 'https:') tlog('! Not served over https — participant links will not work from this copy. Re-run on the hosted address.');
    if (!master){ tlog('✗ No Master Key saved.'); return; }
    let bin = null;
    try {
      if (!S.pkey){ const k = await createAccessKey(master); S.pkey = k.key; S.pkeyName = k.name; save(); tlog('✓ Participant key created (' + k.name + ')'); }
      else tlog('✓ Participant key present (' + (S.pkeyName || 'created') + ')');
      if (S.pkey === master) throw new Error('Participant key equals the Master Key — do not start polls. Forget it and create a new one.');
      tlog('✓ Participant key differs from the Master Key');
      if (S.pkey.startsWith('$2a$')) tlog('! Participant key starts with $2a$ — check in jsonbin → API Keys that it is an Access Key, not a Master Key');
      const j = await api('POST', '/b', { auth:{master}, body:{ pollType:'test', open:true, votes:{} }, headers:{ 'X-Bin-Private':'true', 'X-Bin-Name':'mwb-connection-test' } });
      bin = j && j.metadata && j.metadata.id;
      if (!bin) throw new Error('jsonbin did not return a bin id');
      tlog((j.metadata.private === false ? '✗ Test record was created PUBLIC' : '✓ Test record created') + ' (private=' + j.metadata.private + ')');
      const pa = { access:S.pkey }, nonce = uid();
      const r1 = await readBin(bin, pa); tlog('✓ Read with participant key');
      r1.votes = r1.votes || {}; r1.votes.test = { nonce, at:new Date().toISOString() };
      await writeBin(bin, r1, pa); tlog('✓ Write with participant key');
      const r2 = await readBin(bin, mAuth());
      tlog(r2.votes && r2.votes.test && r2.votes.test.nonce === nonce ? '✓ Test vote verified by facilitator read' : '✗ Test vote not found on re-read');
      let open = false;
      try { await readBin(bin, {}); open = true; } catch(e){}
      tlog(open ? '✗ Record readable WITHOUT a key — it is public. Do not run polls.' : '✓ Record not readable without a key');
    } catch(e){ tlog('✗ ' + e.message); }
    if (bin){
      try { await deleteBin(bin, master); tlog('✓ Test record deleted'); }
      catch(e){ S.bins.push({ id:bin, pid:'test', at:new Date().toISOString() }); tlog('! Could not delete test record — "Delete all poll data" will remove it'); }
    }
    tlog(/✗/.test(testLog) ? '✗ FAILED — fix the ✗ lines before starting polls.' : '✓ All checks passed.');
  });
}
async function syncPoll(pid, quiet){
  const p = S.polls[pid]; if (!p.binId || !master) return;
  try {
    const rec = await readBin(p.binId, mAuth());
    p.votes = mergeVotes(p.votes, rec.votes); p.lastSync = Date.now(); save();
    const ae = document.activeElement;
    if (S.tab === pid && ae && /INPUT|TEXTAREA/.test(ae.tagName) && ae.type !== 'button'){
      const vc = document.getElementById('vc-' + pid); if (vc) vc.innerHTML = `<b>${nVoters(p)}</b> responses · synced ${new Date().toLocaleTimeString()}`;
    } else if (S.tab === pid || S.tab === 'sum') render();
  } catch(e){ if (!quiet) toast(e.message, true); }
}
setInterval(() => {
  if (parseHash() || document.visibilityState !== 'visible' || busy) return;
  Object.keys(S.polls).forEach(pid => { if (S.polls[pid].status === 'open') syncPoll(pid, true); });
}, SYNC_MS);

async function exportPDF(){
  const el = document.getElementById('exportable');
  if (!el || !window.html2canvas || !window.jspdf){ toast('PDF libraries not loaded (offline?). Use the browser’s Print → Save as PDF instead.', true); return; }
  document.body.classList.add('exporting');
  try {
    const canvas = await html2canvas(el, { scale:2, backgroundColor:'#ffffff' });
    const { jsPDF } = window.jspdf, pdf = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
    const pw = 297, ph = 210, m = 10, w = pw - 2*m, h = canvas.height * w / canvas.width;
    const img = canvas.toDataURL('image/png');
    let y = 0;
    do { if (y > 0) pdf.addPage(); pdf.addImage(img, 'PNG', m, m - y, w, h); y += ph - 2*m; } while (y < h);
    const name = (TABS.find(t => t[0]===S.tab) || ['','export'])[1].replace(/[^a-z0-9]+/gi,'-');
    pdf.save(`MWB-poll-${name}-${new Date().toISOString().slice(0,10)}.pdf`);
  } catch(e){ toast('PDF export failed: ' + e.message, true); }
  document.body.classList.remove('exporting');
}
function setPath(obj, path, val){
  const ks = path.split('.'); let o = obj;
  for (let i=0; i<ks.length-1; i++) o = o[ks[i]];
  o[ks[ks.length-1]] = val;
}
function fBind(){
  const app = document.getElementById('app');
  app.addEventListener('input', e => {
    const t = e.target, path = t.dataset.bind; if (!path) return;
    let v = t.dataset.bool ? t.checked : t.dataset.num ? Math.max(1, Math.min(10, parseInt(t.value,10) || 1)) : t.value;
    setPath(S, path, v); save();
    if (path === 'title' || path === 'purpose'){ const h = document.querySelector('.top h1'); if (path==='title' && h) h.textContent = v; }
  });
  app.addEventListener('change', e => { const d = e.target.dataset; if (d.bool || d.num || /^(pre|live)\./.test(d.bind||'')) render(); });
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const a = b.dataset.act, pid = b.dataset.pid;
    if (a === 'tab'){ S.tab = b.dataset.tab; save(); render(); window.scrollTo(0,0); }
    if (a === 'start') startPoll(pid);
    if (a === 'close') closePoll(pid);
    if (a === 'reopen') reopenPoll(pid);
    if (a === 'reset') resetPoll(pid);
    if (a === 'sync') syncPoll(pid);
    if (a === 'qr') showQR(pid);
    if (a === 'pdf') exportPDF();
    if (a === 'copy'){ const i = document.getElementById('link-' + pid); i.select(); (navigator.clipboard ? navigator.clipboard.writeText(i.value) : Promise.reject()).then(() => toast('Link copied'), () => { document.execCommand('copy'); toast('Link copied'); }); }
    if (a === 'addlive'){ if (S.live.length < 5){ S.live.push({ id: uid(), text:'' }); save(); render(); const ins = document.querySelectorAll('[data-bind^="live."]'); if (ins.length) ins[ins.length-1].focus(); } }
    if (a === 'rmlive'){ S.live.splice(+b.dataset.i, 1); save(); render(); }
    if (a === 'bulk'){
      const lines = document.getElementById('bulk').value.split(/\r?\n/).map(x => x.replace(/^\s*\d+[.)]\s*/, '').trim()).filter(Boolean);
      if (!lines.length) return;
      if (lines.length > S.pre.length) toast(`Only the first ${S.pre.length} lines were used.`, true);
      S.pre.forEach((x,i) => x.text = lines[i] || ''); save(); render();
    }
    if (a === 'savemk'){ master = document.getElementById('mk').value.trim(); store.set(LS_MASTER, master); toast(master ? 'Master Key saved in this browser' : 'Cleared'); render(); }
    if (a === 'forgetmk'){ master = ''; store.del(LS_MASTER); render(); }
    if (a === 'conntest') runConnectionTest();
    if (a === 'mkpk') withBusy(async () => { const k = await createAccessKey(master); S.pkey = k.key; S.pkeyName = k.name; toast('Participant key created'); });
    if (a === 'forgetpk'){ if (window.confirm('Forget the participant key? Open polls will stop accepting answers from new page loads only if you also delete the key in jsonbin.')){ S.pkey = null; S.pkeyName = null; save(); render(); } }
    if (a === 'delbins'){
      if (!window.confirm('Permanently delete all poll records created by this browser from jsonbin? Results shown here are kept.')) return;
      withBusy(async () => {
        const left = [];
        for (const x of S.bins){ try { await deleteBin(x.id, master); } catch(e){ if (!/not found/i.test(e.message)) left.push(x); } }
        S.bins = left; toast(left.length ? `${left.length} record(s) could not be deleted` : 'All poll data deleted from jsonbin');
      });
    }
    if (a === 'exportjson'){
      const out = { exportedAt:new Date().toISOString(), title:S.title, polls:{} };
      Object.entries(S.polls).forEach(([k,p]) => out.polls[k] = { title:p.title, type:p.type, questions:p.questions, prompt:p.prompt, items:p.items, status:p.status, votes:votesOf(p) });
      out.preDecided = S.pre; out.addedLive = S.live;
      const blob = new Blob([JSON.stringify(out, null, 2)], { type:'application/json' }), u = URL.createObjectURL(blob), l = document.createElement('a');
      l.href = u; l.download = `MWB-poll-results-${new Date().toISOString().slice(0,10)}.json`; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
    }
    if (a === 'resetall'){ if (window.confirm('Reset the whole canvas? Results in this browser are cleared (jsonbin records are not deleted).')){ S = DEFAULT(); save(); render(); } }
  });
}

/* ---------------- boot ---------------- */
window.addEventListener('hashchange', () => location.reload());
if (parseHash()){ pBind(); pLoad(); }
else { if (!master) S.tab = 'setup'; fBind(); render(); }
</script>
